<article class="card {% firstof extra_class '' %}p-6">
    {% if title %}<h3 class="text-sm font-semibold text-slate-900 dark:text-slate-100">{{ title }}</h3>{% endif %}
    {% if subtitle %}<p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{ subtitle }}</p>{% endif %}
    {% if body %}<p class="mt-4 text-sm text-slate-600 dark:text-slate-300">{{ body }}</p>{% endif %}
</article>
