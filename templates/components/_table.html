<div class="card overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-sm">
            <thead>
                <tr class="border-b border-slate-200 bg-slate-50 text-left dark:border-white/10 dark:bg-slate-800/50">
                    {% for header in headers %}<th scope="col" class="px-4 py-3 text-xs font-medium text-slate-500 dark:text-slate-400">{{ header }}</th>{% endfor %}
                </tr>
            </thead>
            <tbody>
                {% for row in rows %}
                <tr class="border-b border-slate-100 last:border-0 dark:border-white/5">
                    {% for cell in row %}<td class="px-4 py-3 text-slate-600 dark:text-slate-300">{% firstof cell '' %}</td>{% endfor %}
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
