{% extends "account/base.html" %}
{% block title %}Reset password · Wazely{% endblock %}
{% block content %}
<h1 class="text-3xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">Reset password</h1>
<p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Enter your email address and we will send you a link to set a new password.</p>
<div class="mt-8">
    {% include "account/_password_reset_form.html" %}
</div>
<p class="mt-6 text-sm text-slate-500 dark:text-slate-400">
    <a href="{% url 'account_login' %}" class="font-medium text-brand-600 hover:text-brand-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600 dark:text-brand-400 dark:hover:text-brand-300">Back to log in</a>
</p>
{% endblock %}
