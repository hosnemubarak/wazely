<div data-page-title="Password reset sent · Wazely">
    <span class="auth-icon-badge" aria-hidden="true">{% include "components/_icon.html" with name="mail" size="24" %}</span>
    <h1 class="auth-title mt-4" tabindex="-1">Check your email</h1>
    <p class="auth-subtitle">If an account exists with that email address, we have sent you a link to set a new password.</p>
    <p class="auth-meta">
        <a href="{% url 'account_login' %}" class="auth-link" hx-get="{% url 'account_login' %}" hx-target="#auth-content" hx-swap="innerHTML show:window:top" hx-push-url="true">Back to log in</a>
    </p>
    {% include "partials/_toasts_oob.html" %}
</div>
