<div data-page-title="Choose a new password · Wazely">
    <h1 class="auth-title" tabindex="-1">Choose a new password</h1>
    {% if token_fail %}
        <p class="auth-subtitle">This password reset link is invalid or has expired.</p>
        <a class="btn btn-secondary mt-8 w-full" href="{% url 'account_reset_password' %}" hx-get="{% url 'account_reset_password' %}" hx-target="#auth-content" hx-swap="innerHTML show:window:top" hx-push-url="true">Request a new link</a>
    {% else %}
        <p class="auth-subtitle">Enter a new password for your account.</p>
        <div class="mt-8">
            {% include "account/_password_reset_from_key_form.html" %}
        </div>
    {% endif %}
    {% include "partials/_toasts_oob.html" %}
</div>
