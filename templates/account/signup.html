{% extends "account/base.html" %}
{% block title %}Sign up · Wazely{% endblock %}
{% block content %}
<h1 class="text-3xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">Create your account</h1>
<p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Start managing your WhatsApp conversations.</p>
<div class="mt-8">
    {% include "account/_signup_form.html" %}
</div>
<p class="mt-6 text-sm text-slate-500 dark:text-slate-400">
    <a href="{% url 'account_login' %}" class="font-medium text-brand-600 hover:text-brand-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600 dark:text-brand-400 dark:hover:text-brand-300">Already have an account? Log in</a>
</p>
{% endblock %}
