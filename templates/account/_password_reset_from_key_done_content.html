<div data-page-title="Password changed · Wazely">
    <span class="auth-icon-badge" aria-hidden="true">{% include "components/_icon.html" with name="check-circle" size="24" %}</span>
    <h1 class="auth-title mt-4" tabindex="-1">Password changed</h1>
    <p class="auth-subtitle">Your password has been changed. You can now log in with your new password.</p>
    <p class="auth-meta">
        <a href="{% url 'account_login' %}" class="auth-link" hx-get="{% url 'account_login' %}" hx-target="#auth-content" hx-swap="innerHTML show:window:top" hx-push-url="true">Log in</a>
    </p>
    {% include "partials/_toasts_oob.html" %}
</div>
