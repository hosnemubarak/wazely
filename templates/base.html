{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Wazely{% endblock %}</title>
    <script>
        (function () {
            var theme;
            try {
                theme = localStorage.getItem("wazely-theme");
            } catch (err) {}
            if (theme !== "light" && theme !== "dark") {
                theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                    ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-theme", theme);
            try {
                if (localStorage.getItem("wazely-sidebar") === "collapsed") {
                    document.documentElement.setAttribute("data-sidebar", "collapsed");
                }
            } catch (err) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap">
    </noscript>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-100 focus:rounded-md focus:bg-white focus:px-4 focus:py-2 focus:text-sm focus:font-medium focus:text-slate-900 focus:shadow-lg dark:focus:bg-slate-800 dark:focus:text-slate-100">Skip to content</a>
    {% block body %}{% endblock %}
    {% include "partials/_messages.html" %}
    <script src="{% static 'js/app.js' %}" defer></script>
    <script src="{% static 'js/htmx.min.js' %}" defer></script>
    <script src="{% static 'js/alpine.min.js' %}" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
